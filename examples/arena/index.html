<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketJoy Demo – Arena</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d11; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8ebf0; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 13, 17, 0.94);
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  .box { max-width: 560px; }
  h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .muted { color: #929aa9; }
  .url {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 26px;
    font-weight: 600;
    color: #3d8bfd;
    margin: 18px 0 10px;
    word-break: break-all;
  }
  #qr {
    width: 200px;
    height: 200px;
    background: #fff;
    padding: 8px;
    border-radius: 10px;
    margin: 14px auto 6px;
    display: block;
  }
  .small { font-size: 13px; }
  kbd {
    background: #1b2029; border: 1px solid #2a313d; border-radius: 5px;
    padding: 1px 6px; font-size: 12.5px; font-family: inherit;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="overlay">
  <div class="box">
    <h1>Arena</h1>
    <p class="muted" data-i18n="demo.subtitle"></p>
    <img id="qr" alt="">
    <p class="muted small" data-i18n="demo.openOnPhone"></p>
    <p class="url" id="padUrl">…</p>
    <p class="muted small">
      <span id="controlsHint"></span>
    </p>
    <p class="muted small" id="status"></p>
  </div>
</div>

<script type="module" src="/demo/game.js"></script>
</body>
</html>
