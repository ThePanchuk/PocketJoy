<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="PocketJoy - a phone showing a game controller">
  <title>PocketJoy</title>

  <!--
    A phone, upright, with a controller on its screen.

    Drawn for small sizes first: at 16px only three things survive - the
    phone's outline, the dark screen, and two bright clusters on it. So the
    d-pad and the buttons are deliberately chunky and far apart, and there is
    nothing else competing with them. Everything is solid shapes; thin lines
    would disappear.
  -->

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4252"/>
      <stop offset="1" stop-color="#232a36"/>
    </linearGradient>
  </defs>

  <!-- phone body -->
  <rect x="10" y="2" width="44" height="60" rx="8" fill="url(#body)"/>
  <rect x="10" y="2" width="44" height="60" rx="8" fill="none"
        stroke="#5c6778" stroke-width="1.5"/>

  <!-- screen -->
  <rect x="14" y="8" width="36" height="48" rx="4" fill="#0b0d11"/>

  <!-- d-pad, left -->
  <g fill="#3d8bfd">
    <rect x="20" y="17" width="6" height="18" rx="2"/>
    <rect x="14" y="23" width="18" height="6" rx="2"/>
  </g>

  <!-- buttons, right: the two that read at any size -->
  <circle cx="42" cy="20.5" r="4.4" fill="#f2544b"/>
  <circle cx="42" cy="31.5" r="4.4" fill="#2fbf71"/>

  <!-- a stick below, hinting at the real controller without adding noise -->
  <circle cx="22" cy="46" r="6" fill="#1a1f29"/>
  <circle cx="22" cy="46" r="3" fill="#8e97a6"/>
  <circle cx="42" cy="46" r="6" fill="#1a1f29"/>
  <circle cx="42" cy="46" r="3" fill="#8e97a6"/>
</svg>
